spring.application.name=sreeja-portfolio-api
server.port=${PORT:8080}

# Default persistent file-based H2 database (zero external setup)
spring.datasource.url=jdbc:h2:file:./data/portfoliodb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console for inspecting tables at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS & Admin configuration
portfolio.cors.allowed-origins=${PORTFOLIO_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
portfolio.admin.key=${PORTFOLIO_ADMIN_KEY:sreeja-admin-2026}

# Owner social links
portfolio.profile.linkedin=https://www.linkedin.com/in/myadari-sreeja-005432318/
portfolio.profile.github=https://github.com/myadarisreeja
